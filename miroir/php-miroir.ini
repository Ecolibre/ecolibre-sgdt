; Miroir Ecolibre — limites PHP alignées sur la production.
; Valeurs vues par Apache sur le serveur de production (et non par le CLI),
; relevées par Cyril le 9 octobre 2026. Lot 22, tâche 6.
; date.timezone n'est pas déclaré pour Apache en production : il ne l'est pas ici.

memory_limit = 128M
upload_max_filesize = 2M
post_max_size = 8M
max_execution_time = 30
max_input_time = 60
max_file_uploads = 20
; Non déclaré en production : c'est le défaut de PHP, écrit ici pour mémoire.
max_input_vars = 1000

opcache.enable = 1
opcache.memory_consumption = 512
opcache.max_accelerated_files = 32000
