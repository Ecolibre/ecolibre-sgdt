# URL courtes du miroir : /wiki/Titre est servi par /index.php.
# $wgScriptPath = "" et $wgArticlePath = '/wiki/$1', comme en production.
#
# Les règles sont dans le bloc <Directory> et non au niveau serveur : l'hôte
# virtuel par défaut de l'image n'hérite pas des règles de réécriture du
# niveau serveur.
<Directory /var/www/html>
    AllowOverride None
    Require all granted
    RewriteEngine On
    RewriteRule ^/?wiki(/.*)?$ %{DOCUMENT_ROOT}/index.php [L]
    RewriteRule ^/?$ %{DOCUMENT_ROOT}/index.php [L]
</Directory>

# Les dossiers images/ et cache/ ne doivent jamais exécuter de PHP.
<Directory /var/www/html/images>
    RewriteEngine Off
    php_admin_flag engine off
</Directory>
<Directory /var/www/html/cache>
    Require all denied
</Directory>
